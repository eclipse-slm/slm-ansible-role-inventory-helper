---
# Dependency management (download roles/collections)
dependency:
  name: galaxy
  options:
    force: true
    ignore-certs: false
    ignore-errors: false
    role-file: requirements.yml
    requirements-file: requirements.yml

platforms:
  - name: slm-ansible-role-inventory-helper-slm
    groups:
      - slm
    # Kubevirt
    image: quay.io/containerdisks/ubuntu:24.04
    volume_size: 20Gi
    instancetype: u1.large
    # Openstack
    image_name: Ubuntu 24.04 64-bit
    flavor: m1.large
  - name: slm-ansible-role-inventory-helper-test-host
    groups:
      - test-host
    # Kubevirt
    image: quay.io/containerdisks/ubuntu:24.04
    volume_size: 20Gi
    instancetype: u1.large
    # Openstack
    image_name: Ubuntu 24.04 64-bit
    flavor: m1.large


ansible:
  cfg:
    defaults:
      host_key_checking: false
      verbosity: 1
    ssh_connection:
      pipelining: true
  env:
    # ANSIBLE-SPECIFIC:
    ANSIBLE_FORCE_COLOR: "1"
    ANSIBLE_LOAD_CALLBACK_PLUGINS: "1"

    # SLM-SPECIFIC:
    SLM_HOSTNAME: myhost.local
    SLM_IP: 172.17.0.1
    SLM_VERSION: 1.5.0-SNAPSHOT
    INSTALL_DIRECTORY: /opt/eclipse-slm

    # ROLE-SPECIFIC:
    CONSUL_URL: "http://consul:8500"
    VAULT_URL: "http://vault:8200"

  executor:
    backend: ansible-playbook
    args:
      ansible_playbook:
        - --diff
        - --force-handlers
      ansible_navigator:
        - --mode stdout
        - --pull-policy missing
        - --execution-environment-image ghcr.io/ansible/community-ansible-dev-tools:latest

  playbooks:
    create: create-kv.yml
    destroy: destroy-kv.yml
    prepare: prepare.yml
    converge: converge.yml

scenario:
  name: default
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - prepare
    - converge
    - idempotence
    - destroy
